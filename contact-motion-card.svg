    <text x="22" y="84" font-size="20" font-weight="500" fill="#334155">ankit639520@gmail.com</text>

    <rect x="552" y="28" width="520" height="72" rx="16" fill="#F1F5F9"/>
    <text x="574" y="58" font-size="20" font-weight="700" fill="#3730A3">Phone / WhatsApp</text>
    <text x="574" y="84" font-size="20" font-weight="500" fill="#334155">+91 6395204834</text>

    <rect x="0" y="114" width="520" height="72" rx="16" fill="#F1F5F9"/>
    <text x="22" y="144" font-size="20" font-weight="700" fill="#3730A3">Location</text>
    <text x="22" y="170" font-size="20" font-weight="500" fill="#334155">Punjab, India</text>

    <rect x="552" y="114" width="520" height="72" rx="16" fill="#EEF2FF"/>
    <text x="574" y="144" font-size="20" font-weight="700" fill="#3730A3">Portfolio</text>
    <text x="574" y="170" font-size="20" font-weight="500" fill="#334155">github.com/ankitgithub12</text>
