<svg width="1200" height="270" viewBox="0 0 1200 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="contactTitle contactDesc">
  <title id="contactTitle">Contact Card</title>
  <desc id="contactDesc">Contact and networking links with modern visual structure.</desc>
  <defs>
    <linearGradient id="ctb" x1="0" y1="0" x2="1200" y2="270" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/></linearGradient>
    <filter id="cts" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#64748B" flood-opacity="0.2"/></filter>
    <style>.t{font-family:'Inter','Segoe UI',Arial,sans-serif}</style>
  </defs>
  <rect width="1200" height="270" rx="28" fill="#F8FAFC"/>
  <rect x="8" y="8" width="1184" height="254" rx="24" fill="url(#ctb)" stroke="#DBEAFE" stroke-width="2" filter="url(#cts)"/>

  <g class="t" transform="translate(64 54)">
