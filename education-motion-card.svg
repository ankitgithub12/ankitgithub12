<svg width="1200" height="250" viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="eduTitle eduDesc">
  <title id="eduTitle">Education Card</title>
  <desc id="eduDesc">Education details in a clean and modern card.</desc>
  <defs>
    <linearGradient id="edb" x1="0" y1="0" x2="1200" y2="250" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/></linearGradient>
    <filter id="eds" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#64748B" flood-opacity="0.2"/></filter>
    <style>.t{font-family:'Inter','Segoe UI',Arial,sans-serif}</style>
  </defs>
  <rect width="1200" height="250" rx="28" fill="#F8FAFC"/>
  <rect x="8" y="8" width="1184" height="234" rx="24" fill="url(#edb)" stroke="#DBEAFE" stroke-width="2" filter="url(#eds)"/>

  <g class="t" transform="translate(64 58)">
    <text x="0" y="0" font-size="32" font-weight="700" fill="#0F172A">Education</text>
    <rect x="0" y="28" width="1072" height="112" rx="16" fill="#EEF2FF"/>
    <text x="22" y="68" font-size="24" font-weight="700" fill="#3730A3">B.Tech · Computer Science and Engineering</text>
    <text x="22" y="102" font-size="20" font-weight="600" fill="#475569">Lovely Professional University · Punjab, India</text>
    <text x="22" y="130" font-size="18" font-weight="500" fill="#64748B">Strong focus on software engineering, systems, and product development.</text>
  </g>
</svg>
