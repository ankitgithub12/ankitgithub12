<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aboutTitle aboutDesc">
  <title id="aboutTitle">About Profile Card</title>
  <desc id="aboutDesc">Professional summary with consistent visual design and subtle motion.</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9"/><stop offset="0.5" stop-color="#6366F1"/><stop offset="1" stop-color="#3B82F6"/>
      <animate attributeName="x1" values="-1200;1200;-1200" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2400;0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#64748B" flood-opacity="0.2"/></filter>
    <style>.t{font-family:'Inter','Segoe UI',Arial,sans-serif}</style>
  </defs>

  <rect width="1200" height="330" rx="28" fill="#F8FAFC"/>
  <rect x="8" y="8" width="1184" height="314" rx="24" fill="url(#g1)" stroke="url(#g2)" stroke-width="2" filter="url(#s)"/>

  <rect x="64" y="74" width="1072" height="60" rx="16" fill="#EEF2FF"><animate attributeName="x" values="64;76;64" dur="4.8s" repeatCount="indefinite"/></rect>
  <rect x="64" y="145" width="1072" height="60" rx="16" fill="#F1F5F9"><animate attributeName="x" values="64;54;64" dur="5.2s" repeatCount="indefinite"/></rect>
  <rect x="64" y="216" width="1072" height="60" rx="16" fill="#EEF2FF"><animate attributeName="x" values="64;78;64" dur="5.5s" repeatCount="indefinite"/></rect>

  <g class="t">
    <text x="64" y="47" font-size="32" font-weight="700" fill="#0F172A">About</text>
    <text x="88" y="113" font-size="22" font-weight="700" fill="#3730A3">Profile</text>
    <text x="250" y="113" font-size="20" font-weight="500" fill="#334155">B.Tech CSE student and full-stack developer focused on practical, production-ready software</text>

    <text x="88" y="184" font-size="22" font-weight="700" fill="#3730A3">Approach</text>
    <text x="250" y="184" font-size="20" font-weight="500" fill="#334155">Translate product goals into resilient architecture, clean APIs, and maintainable codebases</text>

    <text x="88" y="255" font-size="22" font-weight="700" fill="#3730A3">Domains</text>
    <text x="250" y="255" font-size="20" font-weight="500" fill="#334155">Video-commerce, recruitment platforms, event systems, and education technology</text>
  </g>
</svg>
