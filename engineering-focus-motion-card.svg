<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="engTitle engDesc">
  <title id="engTitle">Engineering Focus - Framer Motion Inspired Card</title>
  <desc id="engDesc">Animated light engineering focus card with motion bands, floating indicators, and polished typography.</desc>
  <defs>
    <linearGradient id="engBg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="engStroke" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#06B6D4"/>
      <animate attributeName="x1" values="-1200;1200;-1200" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2400;0" dur="8.5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="engShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#64748B" flood-opacity="0.2"/>
    </filter>
    <style>
      .t{font-family:'Inter','Segoe UI',Arial,sans-serif}
      .h{font-size:32px;font-weight:700;fill:#0F172A}
      .k{font-size:21px;font-weight:700;fill:#3730A3}
      .v{font-size:20px;font-weight:500;fill:#334155}
    </style>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#engBg)"/>
  <rect x="6" y="6" width="1188" height="328" rx="24" fill="#FFFFFF" stroke="url(#engStroke)" stroke-width="2" filter="url(#engShadow)"/>

  <rect x="68" y="62" width="1064" height="64" rx="16" fill="#EEF2FF">
    <animate attributeName="x" values="68;78;68" dur="4.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="68" y="136" width="1064" height="64" rx="16" fill="#F1F5F9">
    <animate attributeName="x" values="68;60;68" dur="4.7s" repeatCount="indefinite"/>
  </rect>
  <rect x="68" y="210" width="1064" height="64" rx="16" fill="#EEF2FF">
    <animate attributeName="x" values="68;80;68" dur="5.1s" repeatCount="indefinite"/>
  </rect>

  <circle cx="1116" cy="44" r="6" fill="#38BDF8">
    <animate attributeName="cy" values="44;292;44" dur="6.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;1;0.15" dur="6.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1082" cy="292" r="5" fill="#6366F1">
    <animate attributeName="cy" values="292;44;292" dur="6.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.2;1" dur="6.9s" repeatCount="indefinite"/>
  </circle>

  <text x="68" y="38" class="t h">Engineering Focus · Motion-Driven Systems</text>

  <text x="95" y="102" class="t k">Performance-First Delivery</text>
  <text x="438" y="102" class="t v">Ship low-latency experiences with optimized APIs, indexes, and frontend rendering</text>

  <text x="95" y="176" class="t k">Scalable Architecture</text>
  <text x="405" y="176" class="t v">Translate product complexity into maintainable modules, secure services, and stable releases</text>

  <text x="95" y="250" class="t k">Production Reliability</text>
  <text x="390" y="250" class="t v">Prioritize observability, testability, and user trust across every launch cycle</text>
</svg>
