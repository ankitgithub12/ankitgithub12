<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="line2" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4" />
      <stop offset="0.5" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#06B6D4" />
      <animate attributeName="x1" values="-1200;1200;-1200" dur="9s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0;2400;0" dur="9s" repeatCount="indefinite" />
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Inter,Arial,sans-serif;fill:#E2E8F0}
      .h{font-size:32px;font-weight:700;fill:#F8FAFC}
      .k{font-size:22px;font-weight:700;fill:#67E8F9}
      .v{font-size:22px;font-weight:500}
    </style>
  </defs>

  <rect x="6" y="6" width="1188" height="318" rx="28" fill="url(#bg2)" />
  <rect x="6" y="6" width="1188" height="318" rx="28" stroke="url(#line2)" stroke-width="2" />

  <rect x="75" y="55" width="1050" height="62" rx="16" fill="#0B1324" opacity="0.55" />
  <rect x="75" y="129" width="1050" height="62" rx="16" fill="#0B1324" opacity="0.55" />
  <rect x="75" y="203" width="1050" height="62" rx="16" fill="#0B1324" opacity="0.55" />

  <circle cx="1120" cy="38" r="5" fill="#67E8F9">
    <animate attributeName="cy" values="38;295;38" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.15;1;0.15" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1088" cy="295" r="4" fill="#38BDF8">
    <animate attributeName="cy" values="295;38;295" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.2;1" dur="7s" repeatCount="indefinite" />
  </circle>

  <text x="75" y="35" class="t h">Engineering Focus Card</text>

  <text x="100" y="93" class="t k">Performance-First Thinking</text>
  <text x="470" y="93" class="t v">Build fast experiences with scalable backend and efficient data flow</text>

  <text x="100" y="167" class="t k">Architecture Quality</text>
  <text x="390" y="167" class="t v">Convert complex product requirements into robust and intuitive systems</text>

  <text x="100" y="241" class="t k">Production Readiness</text>
  <text x="390" y="241" class="t v">Prioritize maintainability, security, reliability, and usability in every release</text>
</svg>
