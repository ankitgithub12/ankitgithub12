<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skillsTitle skillsDesc">
  <title id="skillsTitle">Skills Card</title>
  <desc id="skillsDesc">Skill categories displayed in premium animated cards.</desc>
  <defs>
    <linearGradient id="sb" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/></linearGradient>
    <filter id="ss" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#64748B" flood-opacity="0.2"/></filter>
    <style>.t{font-family:'Inter','Segoe UI',Arial,sans-serif}</style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#F8FAFC"/>
  <rect x="8" y="8" width="1184" height="344" rx="24" fill="url(#sb)" stroke="#DBEAFE" stroke-width="2" filter="url(#ss)"/>

  <g class="t" transform="translate(64 52)">
    <text x="0" y="0" font-size="32" font-weight="700" fill="#0F172A">Skills</text>

    <g transform="translate(0 26)">
      <rect width="510" height="118" rx="16" fill="#EEF2FF"/>
      <text x="22" y="40" font-size="21" font-weight="700" fill="#3730A3">Languages</text>
      <text x="22" y="78" font-size="20" font-weight="500" fill="#334155">C++ · JavaScript · Python</text>
    </g>

    <g transform="translate(560 26)">
      <rect width="510" height="118" rx="16" fill="#F1F5F9"/>
      <text x="22" y="40" font-size="21" font-weight="700" fill="#3730A3">Frontend</text>
      <text x="22" y="78" font-size="20" font-weight="500" fill="#334155">React · Tailwind CSS · Responsive UI</text>
    </g>

    <g transform="translate(0 162)">
      <rect width="510" height="118" rx="16" fill="#F1F5F9"/>
      <text x="22" y="40" font-size="21" font-weight="700" fill="#3730A3">Backend</text>
      <text x="22" y="78" font-size="20" font-weight="500" fill="#334155">Node.js · Express · JWT · REST APIs</text>
    </g>

    <g transform="translate(560 162)">
      <rect width="510" height="118" rx="16" fill="#EEF2FF"/>
      <text x="22" y="40" font-size="21" font-weight="700" fill="#3730A3">Database & Realtime</text>
      <text x="22" y="78" font-size="20" font-weight="500" fill="#334155">MongoDB · Socket.IO · Performance Tuning</text>
    </g>
  </g>

  <circle cx="1142" cy="48" r="6" fill="#60A5FA"><animate attributeName="cy" values="48;312;48" dur="6.8s" repeatCount="indefinite"/></circle>
  <circle cx="1118" cy="312" r="5" fill="#6366F1"><animate attributeName="cy" values="312;48;312" dur="7.4s" repeatCount="indefinite"/></circle>
</svg>
