<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="projTitle projDesc">
  <title id="projTitle">Projects Card</title>
  <desc id="projDesc">Featured project highlights in a premium layout.</desc>
  <defs>
    <linearGradient id="pb" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/></linearGradient>
    <filter id="ps" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#64748B" flood-opacity="0.2"/></filter>
    <style>.t{font-family:'Inter','Segoe UI',Arial,sans-serif}</style>
  </defs>

  <rect width="1200" height="320" rx="28" fill="#F8FAFC"/>
  <rect x="8" y="8" width="1184" height="304" rx="24" fill="url(#pb)" stroke="#DBEAFE" stroke-width="2" filter="url(#ps)"/>

  <g class="t" transform="translate(64 52)">
    <text x="0" y="0" font-size="32" font-weight="700" fill="#0F172A">Projects</text>

    <rect x="0" y="28" width="1072" height="88" rx="16" fill="#EEF2FF"/>
    <text x="22" y="62" font-size="22" font-weight="700" fill="#3730A3">B5 Eventory · Event Management Platform</text>
    <text x="22" y="93" font-size="18" font-weight="600" fill="#475569">Full MERN platform with planner/admin portals, booking alerts, and architecture tuned for high reliability.</text>

    <rect x="0" y="132" width="1072" height="88" rx="16" fill="#F1F5F9"/>
    <text x="22" y="166" font-size="22" font-weight="700" fill="#3730A3">SRIC School Website</text>
    <text x="22" y="197" font-size="18" font-weight="600" fill="#475569">Admissions and fee workflow system with JWT RBAC, 60% manual work reduction, and 35% faster queries.</text>
  </g>
</svg>
