<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Ankit Kumar Premium Profile Header</title>
  <desc id="desc">Light, premium web-style profile card with clean typography and consistent sections.</desc>

  <defs>
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="chipBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#ddd6fe" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e293b" flood-opacity="0.18" />
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#pageGradient)" />

  <rect x="130" y="50" width="1240" height="400" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#cardShadow)" />
  <rect x="130" y="50" width="1240" height="10" rx="28" fill="url(#accentLine)">
    <animate attributeName="width" values="1240;1200;1240" dur="4.6s" repeatCount="indefinite" />
  </rect>
  <circle cx="1340" cy="90" r="42" fill="#bfdbfe" opacity="0.45" filter="url(#softGlow)">
    <animate attributeName="cy" values="90;126;90" dur="5.6s" repeatCount="indefinite" />
    <animate attributeName="cx" values="1340;1302;1340" dur="5.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="185" cy="415" r="48" fill="#c4b5fd" opacity="0.34" filter="url(#softGlow)">
    <animate attributeName="cx" values="185;232;185" dur="6.3s" repeatCount="indefinite" />
    <animate attributeName="cy" values="415;378;415" dur="6.3s" repeatCount="indefinite" />
  </circle>

  <g transform="translate(205 135)">
    <text x="0" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="700" fill="#0f172a">Ankit Kumar</text>
    <rect x="0" y="24" width="390" height="4" rx="2" fill="url(#accentLine)" />

    <text x="0" y="82" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="500" fill="#334155">Full Stack MERN Developer</text>
    <text x="0" y="126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#475569">Building real-time, scalable, and business-ready web experiences</text>

    <g transform="translate(0 184)">
      <rect x="0" y="0" width="332" height="60" rx="14" fill="#f8fafc" stroke="url(#chipBorder)" />
      <text x="22" y="38" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" fill="#1e293b">React · Node.js · MongoDB</text>
    </g>

    <g transform="translate(0 266)">
      <text x="0" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#4338ca">Focused on product quality, reliability, performance, and scale.</text>
    </g>
  </g>

  <g transform="translate(930 135)">
    <rect x="0" y="0" width="350" height="112" rx="18" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="26" y="40" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a">Core Stack</text>
    <text x="26" y="78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">MERN · Socket.IO · JWT</text>

    <rect x="0" y="132" width="350" height="112" rx="18" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="26" y="172" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#0f172a">Focus Areas</text>
    <text x="26" y="210" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#475569">Real-time apps · scalable systems</text>
  </g>
</svg>
