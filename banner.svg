<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" width="1200" height="280" role="img" aria-labelledby="title desc">
  <title id="title">Ankit Kumar Professional Banner</title>
  <desc id="desc">A clean professional gradient banner with developer title and technology highlights.</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>

  <circle cx="980" cy="40" r="120" fill="#2563eb" opacity="0.22" filter="url(#softGlow)"/>
  <circle cx="1110" cy="230" r="130" fill="#0ea5e9" opacity="0.18" filter="url(#softGlow)"/>

  <g opacity="0.35" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="44" x2="1200" y2="44"/>
    <line x1="0" y1="236" x2="1200" y2="236"/>
  </g>

  <rect x="72" y="55" width="560" height="170" rx="16" fill="#0b1220" opacity="0.82" stroke="#334155"/>

  <text x="100" y="115" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="46" font-weight="700">
    Ankit Kumar
  </text>

  <rect x="100" y="131" width="300" height="4" rx="2" fill="url(#accent)"/>

  <text x="100" y="168" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" font-weight="500">
    Full Stack Developer
  </text>

  <text x="100" y="203" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18">
    React · Node.js · Express · MongoDB · REST APIs
  </text>

  <g transform="translate(800 92)">
    <rect width="320" height="120" rx="14" fill="#0b1220" opacity="0.72" stroke="#334155"/>
    <text x="24" y="42" fill="#e2e8f0" font-family="Consolas, Menlo, monospace" font-size="20">Build. Secure. Scale.</text>
    <text x="24" y="74" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="16">MERN • DSA • Real-time Apps</text>
    <circle cx="279" cy="31" r="7" fill="#22c55e"/>
    <text x="24" y="100" fill="#64748b" font-family="Consolas, Menlo, monospace" font-size="14">Open to internships & collaborations</text>
  </g>
</svg>
