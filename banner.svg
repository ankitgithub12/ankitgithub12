<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
  <title id="title">Ankit Kumar Profile Banner</title>
  <desc id="desc">Premium, modern and consistent profile hero banner with subtle motion accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1500" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="160" y1="0" x2="1340" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#0EA5E9"/>
      <animate attributeName="x1" values="-500;1600;-500" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="200;2600;200" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1E293B" flood-opacity="0.16"/>
    </filter>
    <filter id="glow"><feGaussianBlur stdDeviation="20"/></filter>
    <style>
      .t{font-family:'Inter','Segoe UI',Arial,sans-serif}
    </style>
  </defs>

  <rect width="1500" height="520" fill="url(#bg)"/>
  <rect x="100" y="44" width="1300" height="432" rx="30" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <rect x="100" y="44" width="1300" height="8" rx="30" fill="url(#accent)"/>

  <circle cx="1328" cy="102" r="52" fill="#BFDBFE" opacity="0.42" filter="url(#glow)">
    <animate attributeName="cy" values="102;138;102" dur="6.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="420" r="62" fill="#C4B5FD" opacity="0.32" filter="url(#glow)">
    <animate attributeName="cx" values="170;222;170" dur="7.4s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(180 130)" class="t">
    <text x="0" y="0" font-size="70" font-weight="700" fill="#0F172A">Ankit Kumar</text>
    <rect x="0" y="24" width="390" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="84" font-size="34" font-weight="600" fill="#334155">Full Stack Developer · MERN Specialist</text>
    <text x="0" y="130" font-size="25" font-weight="500" fill="#475569">Designing scalable products with clean architecture, performance, and reliability.</text>

    <g transform="translate(0 190)">
      <rect width="356" height="60" rx="14" fill="#F8FAFC" stroke="#DBEAFE"/>
      <text x="20" y="39" font-size="23" font-weight="600" fill="#1E293B">React · Node.js · MongoDB</text>
    </g>

    <g transform="translate(0 272)">
      <text x="0" y="0" font-size="21" font-weight="600" fill="#4338CA">Open for impactful engineering opportunities.</text>
    </g>
  </g>

  <g transform="translate(930 122)" class="t">
    <rect width="372" height="120" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="42" font-size="24" font-weight="700" fill="#0F172A">Core Expertise</text>
    <text x="24" y="80" font-size="20" font-weight="500" fill="#475569">Realtime Apps · API Design · RBAC</text>

    <rect y="142" width="372" height="120" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="184" font-size="24" font-weight="700" fill="#0F172A">Product Focus</text>
    <text x="24" y="222" font-size="20" font-weight="500" fill="#475569">UX Quality · Scale · Business Impact</text>
  </g>
</svg>
