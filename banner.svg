<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" width="900" height="220">
  <defs>

    <!-- Deep space background gradient -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#000008"/>
      <stop offset="35%"  stop-color="#06001a"/>
      <stop offset="65%"  stop-color="#0a0030"/>
      <stop offset="100%" stop-color="#000010"/>
    </linearGradient>

    <!-- Nebula glow left -->
    <radialGradient id="nebula1" cx="20%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#7b2fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7b2fff" stop-opacity="0"/>
    </radialGradient>

    <!-- Nebula glow right -->
    <radialGradient id="nebula2" cx="80%" cy="40%" r="35%">
      <stop offset="0%"   stop-color="#48cae4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#48cae4" stop-opacity="0"/>
    </radialGradient>

    <!-- Nebula glow center -->
    <radialGradient id="nebula3" cx="50%" cy="60%" r="30%">
      <stop offset="0%"   stop-color="#c77dff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c77dff" stop-opacity="0"/>
    </radialGradient>

    <!-- Text glow filter -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft star glow -->
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to bounds -->
    <clipPath id="bounds">
      <rect width="900" height="220"/>
    </clipPath>

    <style>
      /* Star twinkle animations — varied delays for natural feel */
      .s1  { animation: twinkle 2.1s ease-in-out infinite; }
      .s2  { animation: twinkle 3.4s ease-in-out infinite 0.5s; }
      .s3  { animation: twinkle 2.7s ease-in-out infinite 1.1s; }
      .s4  { animation: twinkle 4.0s ease-in-out infinite 0.3s; }
      .s5  { animation: twinkle 1.8s ease-in-out infinite 1.7s; }
      .s6  { animation: twinkle 3.1s ease-in-out infinite 0.9s; }
      .s7  { animation: twinkle 2.5s ease-in-out infinite 2.2s; }
      .s8  { animation: twinkle 3.8s ease-in-out infinite 0.6s; }
      .s9  { animation: twinkle 2.2s ease-in-out infinite 1.4s; }
      .s10 { animation: twinkle 4.2s ease-in-out infinite 0.1s; }
      .s11 { animation: twinkle 1.9s ease-in-out infinite 2.8s; }
      .s12 { animation: twinkle 3.3s ease-in-out infinite 1.9s; }
      .s13 { animation: twinkle 2.9s ease-in-out infinite 0.7s; }
      .s14 { animation: twinkle 3.6s ease-in-out infinite 2.4s; }
      .s15 { animation: twinkle 2.4s ease-in-out infinite 1.2s; }

      /* Shooting star */
      .shoot { animation: shoot 6s linear infinite 2s; }
      .shoot2 { animation: shoot 9s linear infinite 5s; }

      /* Title pulse glow */
      .title { animation: titlePulse 3s ease-in-out infinite; }

      /* Subtitle fade in */
      .subtitle { animation: fadeSlide 1.2s ease-out forwards; opacity: 0; }

      /* Underline draw */
      .underline { animation: drawLine 1.5s ease-out 0.8s forwards; stroke-dasharray: 400; stroke-dashoffset: 400; }

      /* Orbit ring rotate */
      .orbit { animation: orbit 20s linear infinite; transform-origin: 450px 110px; }

      @keyframes twinkle {
        0%, 100% { opacity: 1;   r: var(--r); }
        50%       { opacity: 0.1; r: calc(var(--r) * 0.6); }
      }
      @keyframes shoot {
        0%   { transform: translateX(0)   translateY(0);   opacity: 1; }
        100% { transform: translateX(300px) translateY(80px); opacity: 0; }
      }
      @keyframes titlePulse {
        0%, 100% { filter: url(#textGlow); fill: #e0aaff; }
        50%       { filter: url(#textGlow); fill: #ffffff; }
      }
      @keyframes fadeSlide {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes orbit {
        from { transform: rotate(0deg)   translateX(0) translateY(0); }
        to   { transform: rotate(360deg) translateX(0) translateY(0); }
      }
    </style>
  </defs>

  <g clip-path="url(#bounds)">

    <!-- ── BACKGROUND ── -->
    <rect width="900" height="220" fill="url(#spaceBg)"/>

    <!-- ── NEBULA GLOWS ── -->
    <rect width="900" height="220" fill="url(#nebula1)"/>
    <rect width="900" height="220" fill="url(#nebula2)"/>
    <rect width="900" height="220" fill="url(#nebula3)"/>

    <!-- ── SHOOTING STARS ── -->
    <line class="shoot"  x1="50"  y1="20"  x2="90"  y2="35"  stroke="white" stroke-width="1" opacity="0.7"/>
    <line class="shoot2" x1="700" y1="10"  x2="750" y2="28"  stroke="#c77dff" stroke-width="0.8" opacity="0.6"/>

    <!-- ── TWINKLING STARS ── -->
    <!-- Large bright stars -->
    <circle class="s1"  cx="45"  cy="18"  r="2"   fill="white"   style="--r:2"  filter="url(#starGlow)"/>
    <circle class="s2"  cx="820" cy="25"  r="2.2" fill="#e0aaff" style="--r:2.2" filter="url(#starGlow)"/>
    <circle class="s3"  cx="150" cy="190" r="1.8" fill="white"   style="--r:1.8" filter="url(#starGlow)"/>
    <circle class="s4"  cx="750" cy="180" r="2"   fill="#48cae4" style="--r:2"  filter="url(#starGlow)"/>
    <circle class="s5"  cx="870" cy="100" r="1.6" fill="white"   style="--r:1.6" filter="url(#starGlow)"/>
    <circle class="s6"  cx="30"  cy="140" r="1.9" fill="#c77dff" style="--r:1.9" filter="url(#starGlow)"/>

    <!-- Medium stars -->
    <circle class="s7"  cx="680" cy="15"  r="1.2" fill="white"   style="--r:1.2"/>
    <circle class="s8"  cx="200" cy="30"  r="1.1" fill="#e0aaff" style="--r:1.1"/>
    <circle class="s9"  cx="560" cy="200" r="1.3" fill="white"   style="--r:1.3"/>
    <circle class="s10" cx="100" cy="80"  r="1"   fill="#48cae4" style="--r:1"/>
    <circle class="s11" cx="800" cy="60"  r="1.2" fill="white"   style="--r:1.2"/>
    <circle class="s12" cx="380" cy="15"  r="0.9" fill="#c77dff" style="--r:0.9"/>
    <circle class="s13" cx="60"  cy="200" r="1"   fill="white"   style="--r:1"/>
    <circle class="s14" cx="850" cy="190" r="1.1" fill="#e0aaff" style="--r:1.1"/>
    <circle class="s15" cx="490" cy="205" r="0.9" fill="white"   style="--r:0.9"/>

    <!-- Tiny background stars (static) -->
    <circle cx="130" cy="55"  r="0.6" fill="white" opacity="0.5"/>
    <circle cx="310" cy="185" r="0.5" fill="white" opacity="0.4"/>
    <circle cx="430" cy="40"  r="0.7" fill="#e0aaff" opacity="0.5"/>
    <circle cx="620" cy="170" r="0.6" fill="white" opacity="0.45"/>
    <circle cx="720" cy="95"  r="0.5" fill="white" opacity="0.4"/>
    <circle cx="270" cy="70"  r="0.6" fill="#48cae4" opacity="0.45"/>
    <circle cx="840" cy="145" r="0.5" fill="white" opacity="0.4"/>
    <circle cx="170" cy="155" r="0.6" fill="white" opacity="0.5"/>
    <circle cx="780" cy="210" r="0.5" fill="#c77dff" opacity="0.4"/>
    <circle cx="500" cy="25"  r="0.6" fill="white" opacity="0.45"/>
    <circle cx="350" cy="130" r="0.4" fill="white" opacity="0.35"/>
    <circle cx="660" cy="55"  r="0.5" fill="white" opacity="0.4"/>
    <circle cx="90"  cy="105" r="0.6" fill="#e0aaff" opacity="0.45"/>

    <!-- ── ORBIT RING (decorative) ── -->
    <ellipse cx="450" cy="110" rx="320" ry="88"
             fill="none" stroke="#7b2fff" stroke-width="0.4" opacity="0.2"
             stroke-dasharray="4 8"/>

    <!-- ── TITLE TEXT ── -->
    <text class="title"
          x="450" y="105"
          font-family="'Trebuchet MS', 'Segoe UI', sans-serif"
          font-size="62"
          font-weight="900"
          letter-spacing="12"
          text-anchor="middle"
          fill="#e0aaff">
      ANKIT KUMAR
    </text>

    <!-- ── ANIMATED UNDERLINE ── -->
    <line class="underline"
          x1="200" y1="118" x2="700" y2="118"
          stroke="#7b2fff" stroke-width="1.5" opacity="0.8"/>

    <!-- ── SUBTITLE ── -->
    <text class="subtitle"
          x="450" y="155"
          font-family="'Courier New', monospace"
          font-size="15"
          letter-spacing="4"
          text-anchor="middle"
          fill="#48cae4"
          opacity="0">
      ✦  FULL STACK DEVELOPER  ·  MERN  ·  DSA  ✦
    </text>

    <!-- ── BOTTOM GLOW LINE ── -->
    <line x1="0" y1="219" x2="900" y2="219"
          stroke="#7b2fff" stroke-width="1" opacity="0.5"/>

  </g>
</svg>
