<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aboutTitle aboutDesc">
  <title id="aboutTitle">Profile Hero Card</title>
  <desc id="aboutDesc">Premium profile card with subtle transitions and clear hierarchy.</desc>
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1200" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="as" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#14B8A6"/>
      <animate attributeName="x1" values="-1200;1200;-1200" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2400;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="ashadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#64748B" flood-opacity="0.2"/></filter>
    <style>.t{font-family:'Inter','Segoe UI',Arial,sans-serif}</style>
  </defs>

  <rect width="1200" height="390" rx="28" fill="#F8FAFC"/>
  <rect x="8" y="8" width="1184" height="374" rx="24" fill="url(#abg)" stroke="url(#as)" stroke-width="2" filter="url(#ashadow)"/>

  <rect x="64" y="88" width="1072" height="56" rx="14" fill="#EEF2FF"><animate attributeName="x" values="64;74;64" dur="4.8s" repeatCount="indefinite"/></rect>
  <rect x="64" y="155" width="1072" height="56" rx="14" fill="#F1F5F9"><animate attributeName="x" values="64;56;64" dur="5.1s" repeatCount="indefinite"/></rect>
  <rect x="64" y="222" width="1072" height="56" rx="14" fill="#EEF2FF"><animate attributeName="x" values="64;76;64" dur="5.4s" repeatCount="indefinite"/></rect>

  <g class="t">
    <text x="64" y="58" font-size="34" font-weight="700" fill="#0F172A">Hero Snapshot</text>
    <text x="88" y="124" font-size="22" font-weight="700" fill="#3730A3">Role</text>
    <text x="234" y="124" font-size="21" font-weight="500" fill="#334155">Full-stack engineer delivering scalable web products with production-grade architecture</text>

    <text x="88" y="191" font-size="22" font-weight="700" fill="#3730A3">Strengths</text>
    <text x="234" y="191" font-size="21" font-weight="500" fill="#334155">Realtime systems, API security, performance tuning, and clear product execution</text>

    <text x="88" y="258" font-size="22" font-weight="700" fill="#3730A3">Mission</text>
    <text x="234" y="258" font-size="21" font-weight="500" fill="#334155">Build polished experiences that balance speed, reliability, and measurable business impact</text>
  </g>

  <rect x="64" y="304" width="470" height="46" rx="23" fill="#DBEAFE"><animate attributeName="opacity" values="0.7;1;0.7" dur="2.6s" repeatCount="indefinite"/></rect>
  <text x="88" y="335" class="t" font-size="18" font-weight="700" fill="#1D4ED8">Available for high-impact full-stack engineering roles</text>
</svg>
