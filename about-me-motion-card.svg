<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220" />
      <stop offset="1" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" />
      <stop offset="0.5" stop-color="#818CF8" />
      <stop offset="1" stop-color="#22D3EE" />
      <animate attributeName="x1" values="-1200;1200;-1200" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0;2400;0" dur="8s" repeatCount="indefinite" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <style>
      .t{font-family:'Segoe UI',Inter,Arial,sans-serif;fill:#E2E8F0}
      .h{font-size:34px;font-weight:700;fill:#F8FAFC}
      .k{font-size:22px;font-weight:700;fill:#7DD3FC}
      .v{font-size:22px;font-weight:500}
    </style>
  </defs>

  <rect x="6" y="6" width="1188" height="408" rx="28" fill="url(#bg)" />
  <rect x="6" y="6" width="1188" height="408" rx="28" stroke="url(#stroke)" stroke-width="2" />

  <circle cx="1020" cy="90" r="75" fill="#2563EB" opacity="0.3" filter="url(#blur)">
    <animate attributeName="cy" values="90;120;90" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="190" cy="335" r="95" fill="#0891B2" opacity="0.25" filter="url(#blur)">
    <animate attributeName="cx" values="190;240;190" dur="7s" repeatCount="indefinite" />
  </circle>

  <text x="70" y="78" class="t h">Profile Snapshot</text>

  <text x="70" y="132" class="t k">Role</text>
  <text x="245" y="132" class="t v">Full-Stack Developer building scalable, high-performance products with React, Node.js, Express, and MongoDB</text>

  <text x="70" y="185" class="t k">Strength</text>
  <text x="245" y="185" class="t v">Scalable architecture, real-time systems, and product-focused engineering</text>

  <text x="70" y="238" class="t k">Education</text>
  <text x="245" y="238" class="t v">B.Tech in Computer Science &amp; Engineering @ Lovely Professional University</text>

  <text x="70" y="291" class="t k">Domain Exposure</text>
  <text x="300" y="291" class="t v">Video-commerce, recruitment tech, event tech, and education platforms</text>

  <text x="70" y="344" class="t k">Availability</text>
  <text x="245" y="344" class="t v">Open for high-impact full-time roles and freelance opportunities</text>

  <rect x="70" y="368" width="325" height="30" rx="15" fill="#0EA5E9" opacity="0.16">
    <animate attributeName="opacity" values="0.1;0.28;0.1" dur="3s" repeatCount="indefinite" />
  </rect>
  <text x="90" y="389" class="t" style="font-size:16px;font-weight:600;fill:#BAE6FD;">Available for impactful builds</text>
</svg>
